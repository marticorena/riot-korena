services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: korena
      POSTGRES_PASSWORD: password
      POSTGRES_DB: support_coach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://korena:password@db:5432/support_coach
    depends_on:
      - db
    # In development we want hot reloading
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      # Map node_modules securely inside container to prevent overriding by local vol
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # Required for hot reload in Docker/Windows systems
    depends_on:
      - backend

volumes:
  postgres_data:
